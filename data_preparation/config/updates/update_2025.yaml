# Settings of the data-preparation update pipeline.
# Edit this file as needed or use it as template for new updates
# This update covers 2024 AND 2025 (the former update_2024 is merged here)

datasets:
  popolazione:
    enabled: true
    sources:
      - file: popolazione_2026_ISPAT.csv
        reader: csv
        adapter: popolazione_ispat_1jan
        adapter_kwargs: {year: 2025}        # uses column "Popolazione residente al 1.1.2025"

  strutture:
    enabled: true
    sources:
      - file: numero_strutture_ISPAT_2025.xlsx
        reader: excel
        reader_kwargs: {header: [0, 1]}
        adapter: strutture_annuario
        adapter_kwargs: {year: 2025}
        label: "2025"

  vodafone:
    enabled: true
    sources:
      - file: vodafone_attendences_new.csv
        reader: csv
        adapter: vodafone_raw             # 2023-01-01 .. 2025-12-31 (the base build has vodafone_attendences, 2022-01-01 .. 2024-03-31; on the overlap this file wins)

  presenze_alb:
    enabled: true
    sources:                                  # arrivals + presences, used as downloaded (no normalization)
      - file: Presenze/presenze_alb_2024.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2024, measure: presenze}
      - file: Presenze/arrivi_alb_2024.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2024, measure: arrivi}
      - file: Presenze/presenze_alb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: presenze}
      - file: Presenze/arrivi_alb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: arrivi}

  presenze_extralb:
    enabled: true
    sources:                                  # arrivals + presences, used as downloaded (no normalization)
      - file: Presenze/arrivi_exalb_2024.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2024, measure: arrivi}
      - file: Presenze/presenze_exalb_2024.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2024, measure: presenze}
      - file: Presenze/arrivi_exalb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: arrivi}
      - file: Presenze/presenze_exalb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: presenze}
