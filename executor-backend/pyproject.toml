[project]
name = "executor-backend"
version = "0.1.0"
description = "FastAPI and Streamlit backend for the overtourism models"
requires-python = ">=3.12"
dependencies = [
    "civic-digital-twins>=0.12.0,<0.13",
    "digitalhub==0.15.11",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "plotly==7.1.0",
    "pydantic>=2.12,<3",
    "scipy==1.18.1",
    "streamlit==1.64.0",
]
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "httpx2",
    "mypy>=2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
